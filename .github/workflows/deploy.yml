name: Deploy DDLs to Snowflake (SnowSQL)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Selecciona el entorno destino"
        required: true
        type: choice
        options: [sit, prod]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Instala SnowSQL (cliente clásico, estable)
      - name: Install SnowSQL
        uses: snow-actions/setup-snowsql@v1

      # Mapea ROLE y WAREHOUSE según el entorno elegido en el botón
      - name: Map role & warehouse by environment
        id: map
        shell: bash
        run: |
          if [ "${{ github.event.inputs.environment }}" = "sit" ]; then
            echo "ROLE=SIT_ROLE" >> $GITHUB_OUTPUT
            echo "WH=SIT_WH"     >> $GITHUB_OUTPUT
          else
            echo "ROLE=PROD_ROLE" >> $GITHUB_OUTPUT
            echo "WH=PROD_WH"     >> $GITHUB_OUTPUT
          fi

      # Detecta versiones pendientes leyendo la tabla de log con snowsql
      - name: Detect pending versions
        id: pending
        shell: bash
        env:
          SF_ACCOUNT:  ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SF_USER:     ${{ secrets.SNOWFLAKE_USER }}
          SF_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(sql/R_ddls_*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "⚠️ No hay ficheros en /sql con patrón R_ddls_*.sql"
            echo "none=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Orden natural por versión
          printf "%s\n" "${files[@]}" | sort -V > all_files.txt

          # Consulta versiones ya ejecutadas para el entorno
          snowsql \
            -a "$SF_ACCOUNT" \
            -u "$SF_USER" \
            -p "$SF_PASSWORD" \
            -r "${{ steps.map.outputs.ROLE }}" \
            -w "${{ steps.map.outputs.WH }}" \
            -d CICD_CONTROL \
            -s DEPLOYMENTS \
            -q "SELECT VERSION FROM DEPLOY_LOG WHERE ENVIRONMENT = UPPER('${{ github.event.inputs.environment }}');" \
            -o output_format=csv \
            -o header=false \
            -o timing=false \
            > executed.txt || true

          pending=()
          while read -r f; do
            ver=$(basename "$f" .sql | cut -d'_' -f3)
            if ! grep -qx "$ver" executed.txt 2>/dev/null; then
              pending+=("$f")
            fi
          done < all_files.txt

          if [ ${#pending[@]} -eq 0 ]; then
            echo "✅ No hay versiones nuevas para desplegar."
            echo "none=true" >> $GITHUB_OUTPUT
          else
            printf "%s\n" "${pending[@]}" > pending.txt
            echo "Se desplegarán:"
            cat pending.txt
            echo "none=false" >> $GITHUB_OUTPUT
          fi

      # Ejecuta sólo las pendientes y registra en el log
      - name: Deploy pending SQLs
        if: steps.pending.outputs.none == 'false'
        shell: bash
        env:
          SF_ACCOUNT:  ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SF_USER:     ${{ secrets.SNOWFLAKE_USER }}
          SF_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: |
          set -euo pipefail

          while read -r file; do
            ver=$(basename "$file" .sql | cut -d'_' -f3)
            echo "🚀 Ejecutando $file (versión $ver) en ${{ github.event.inputs.environment }}"

            # Ejecuta el fichero SQL (si quieres fallo duro: -o exit_on_error=true)
            snowsql \
              -a "$SF_ACCOUNT" \
              -u "$SF_USER" \
              -p "$SF_PASSWORD" \
              -r "${{ steps.map.outputs.ROLE }}" \
              -w "${{ steps.map.outputs.WH }}" \
              -f "$file" \
              -o exit_on_error=true \
              -o timing=false

            # Registrar éxito
            snowsql \
              -a "$SF_ACCOUNT" \
              -u "$SF_USER" \
              -p "$SF_PASSWORD" \
              -r "${{ steps.map.outputs.ROLE }}" \
              -w "${{ steps.map.outputs.WH }}" \
              -d CICD_CONTROL \
              -s DEPLOYMENTS \
              -q "INSERT INTO DEPLOY_LOG (ENVIRONMENT, VERSION, STATUS, EXECUTED_BY)
                  VALUES (UPPER('${{ github.event.inputs.environment }}'), '$ver', 'SUCCESS', '${{ github.actor }}');" \
              -o timing=false
          done < pending.txt

      - name: Done
        run: echo "✅ Despliegue completado sin prompts ni sorpresas (SnowSQL)."
