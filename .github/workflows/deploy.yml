name: Deploy DDLs to Snowflake

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Selecciona el entorno destino"
        required: true
        type: choice
        options: [sit, prod]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Snowflake CLI
        uses: snowflakedb/snowflake-cli-action@v2.0
        with:
          python-cache-dependency-glob: ""

      # Mapa ROLE/WH por entorno
      - name: Map role & warehouse by environment
        id: map
        shell: bash
        run: |
          if [ "${{ github.event.inputs.environment }}" = "sit" ]; then
            echo "ROLE=SIT_ROLE" >> $GITHUB_OUTPUT
            echo "WH=SIT_WH"     >> $GITHUB_OUTPUT
          else
            echo "ROLE=PROD_ROLE" >> $GITHUB_OUTPUT
            echo "WH=PROD_WH"     >> $GITHUB_OUTPUT
          fi

      # Detectar versiones pendientes (SIN conexiones guardadas; SIN prompts)
      - name: Detect pending versions
        id: pending
        shell: bash
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(sql/R_ddls_*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "⚠️ No hay ficheros en /sql con patrón R_ddls_*.sql"
            echo "none=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Orden natural por versión
          printf "%s\n" "${files[@]}" | sort -V > all_files.txt

          # Obtener versiones ya ejecutadas para el entorno
          snow sql \
            --account "$SNOWFLAKE_ACCOUNT" \
            --username "$SNOWFLAKE_USER" \
            --password "$SNOWFLAKE_PASSWORD" \
            --role "${{ steps.map.outputs.ROLE }}" \
            --warehouse "${{ steps.map.outputs.WH }}" \
            --database "CICD_CONTROL" \
            --schema "DEPLOYMENTS" \
            --query "SELECT VERSION FROM DEPLOY_LOG WHERE ENVIRONMENT = UPPER('${{ github.event.inputs.environment }}');" \
            --output-format csv \
            | tail -n +2 > executed.txt

          pending=()
          while read -r f; do
            ver=$(basename "$f" .sql | cut -d'_' -f3)
            if ! grep -qx "$ver" executed.txt 2>/dev/null; then
              pending+=("$f")
            fi
          done < all_files.txt

          if [ ${#pending[@]} -eq 0 ]; then
            echo "✅ No hay versiones nuevas para desplegar."
            echo "none=true" >> $GITHUB_OUTPUT
          else
            printf "%s\n" "${pending[@]}" > pending.txt
            echo "Se desplegarán:"
            cat pending.txt
            echo "none=false" >> $GITHUB_OUTPUT
          fi

      # Ejecutar SOLO las pendientes y registrar en el log
      - name: Deploy pending SQLs
        if: steps.pending.outputs.none == 'false'
        shell: bash
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: |
          set -euo pipefail
          while read -r file; do
            ver=$(basename "$file" .sql | cut -d'_' -f3)
            echo "🚀 Ejecutando $file (versión $ver) en ${{ github.event.inputs.environment }}"

            # Ejecuta el fichero SQL directamente (sin !source, sin prompts)
            snow sql \
              --account "$SNOWFLAKE_ACCOUNT" \
              --username "$SNOWFLAKE_USER" \
              --password "$SNOWFLAKE_PASSWORD" \
              --role "${{ steps.map.outputs.ROLE }}" \
              --warehouse "${{ steps.map.outputs.WH }}" \
              --file "$file"

            # Registrar éxito
            snow sql \
              --account "$SNOWFLAKE_ACCOUNT" \
              --username "$SNOWFLAKE_USER" \
              --password "$SNOWFLAKE_PASSWORD" \
              --role "${{ steps.map.outputs.ROLE }}" \
              --warehouse "${{ steps.map.outputs.WH }}" \
              --database "CICD_CONTROL" \
              --schema "DEPLOYMENTS" \
              --query "INSERT INTO DEPLOY_LOG (ENVIRONMENT, VERSION, STATUS, EXECUTED_BY)
                       VALUES (UPPER('${{ github.event.inputs.environment }}'), '$ver', 'SUCCESS', '${{ github.actor }}');"
          done < pending.txt

      - name: Done
        run: echo "✅ Despliegue completado sin prompts ni flags inválidos."
