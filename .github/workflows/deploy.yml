name: Deploy to Snowflake

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Selecciona el entorno destino"
        required: true
        type: choice
        options:
          - sit
          - prod

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Snowflake CLI
        uses: snowflakedb/snowflake-cli-action@v2.0
        with:
          use-oidc: true

      - name: Determine prefix based on environment
        id: envmap
        run: |
          if [[ "${{ github.event.inputs.environment }}" == "sit" ]]; then
            echo "prefix=SIT_" >> $GITHUB_OUTPUT
            echo "role=SIT_ROLE" >> $GITHUB_OUTPUT
            echo "warehouse=SIT_WH" >> $GITHUB_OUTPUT
          else
            echo "prefix=PROD_" >> $GITHUB_OUTPUT
            echo "role=PROD_ROLE" >> $GITHUB_OUTPUT
            echo "warehouse=PROD_WH" >> $GITHUB_OUTPUT
          fi

      - name: Find pending SQL scripts
        id: pending
        run: |
          echo "Checking which scripts are pending..."
          # Guardamos todas las versiones de archivos
          all_files=$(ls sql/R_ddls_*.sql | sort)
          echo "Found files:"
          echo "$all_files"

          # Consultamos en Snowflake cuáles están ya ejecutados
          executed=$(snow sql -q "
            SELECT VERSION FROM CICD_CONTROL.DEPLOYMENTS.DEPLOY_LOG
            WHERE ENVIRONMENT = upper('${{ github.event.inputs.environment }}')
          " --output-format csv | tail -n +2)

          echo "Already executed:"
          echo "$executed"

          pending_files=()
          for f in $all_files; do
            version=$(basename "$f" .sql | cut -d'_' -f3)
            if ! grep -q "$version" <<< "$executed"; then
              pending_files+=("$f")
            fi
          done

          if [ ${#pending_files[@]} -eq 0 ]; then
            echo "✅ No new SQL files to deploy."
            echo "none=true" >> $GITHUB_OUTPUT
          else
            printf "%s\n" "${pending_files[@]}" > pending_files.txt
            echo "none=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy pending SQL scripts
        if: steps.pending.outputs.none == 'false'
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
        run: |
          while read file; do
            version=$(basename "$file" .sql | cut -d'_' -f3)
            echo "🚀 Deploying $file to ${{ github.event.inputs.environment }} (version $version)"

            # Preprocesar prefijos de entorno si lo necesitas
            sed -E "s/\bDEV_/$(echo "${{ steps.envmap.outputs.prefix }}")/g" "$file" > tmp.sql

            # Ejecutar el SQL
            snow sql -q "USE ROLE ${{ steps.envmap.outputs.role }};
                         USE WAREHOUSE ${{ steps.envmap.outputs.warehouse }};
                         !source tmp.sql;"

            # Registrar éxito
            snow sql -q "
              INSERT INTO CICD_CONTROL.DEPLOYMENTS.DEPLOY_LOG (ENVIRONMENT, VERSION, STATUS, EXECUTED_BY)
              VALUES (upper('${{ github.event.inputs.environment }}'), '$version', 'SUCCESS', '${{ github.actor }}');
            "
          done < pending_files.txt

      - name: Done
        run: echo "✅ Deployment complete."
