name: (DEPRECATED) PR sit → main (prod)
on:
  workflow_dispatch: {}
  push:
    branches: [ "sit" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Create PR sit → main
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Promote sit → main (prod)"
          body: "Promoción automática de cambios de sit hacia producción."
          base: "main"     # o "prod" si tu rama de prod se llama prod
          branch: "sit"
          draft: false
