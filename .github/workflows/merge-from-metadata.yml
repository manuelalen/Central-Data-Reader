name: Run MERGE (safe) from T_METADATA

on:
  workflow_dispatch:
    inputs:
      ingestion_name:
        description: "Valor de INGESTION_NAME en T_METADATA"
        required: true
        default: "1.INGESTION-TO-PROD"

permissions:
  contents: read

jobs:
  run-merge-safe:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Snowflake CLI
        uses: snowflakedb/snowflake-cli-action@v2.0
        with:
          python-cache-dependency-glob: ""

      - name: Configure Snowflake connection
        shell: bash
        env:
          SF_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SF_USER:      ${{ secrets.SNOWFLAKE_USER }}
          SF_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
          SF_ROLE:      ${{ secrets.SNOWFLAKE_ROLE }}
          SF_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.snowflake && chmod 700 ~/.snowflake
          cat > ~/.snowflake/config.toml <<EOF
          [connections.default]
          account = "${SF_ACCOUNT}"
          user = "${SF_USER}"
          password = "${SF_PASSWORD}"
          role = "${SF_ROLE}"
          warehouse = "${SF_WAREHOUSE}"
          authenticator = "snowflake"
          client_session_keep_alive = true
          EOF
          chmod 600 ~/.snowflake/config.toml
          export SF_SKIP_WARNING_FOR_READ_PERMISSIONS_ON_CONFIG_FILE=true
          snow --version
          snow sql -q "SELECT CURRENT_ACCOUNT(), CURRENT_ROLE(), CURRENT_WAREHOUSE();"

      - name: Prepare SQL (inject ingestion)
        shell: bash
        run: |
          set -euo pipefail
          ING="${{ github.event.inputs.ingestion_name }}"
          sed "s/__ING__/${ING//\//\\/}/g" scripts/merge_from_metadata_safe.sql > run_merge.sql
          head -n 20 run_merge.sql || true

      - name: Execute MERGE(s)
        shell: bash
        run: |
          set -euo pipefail
          snow sql --filename run_merge.sql

      - name: Done
        run: echo "✅ MERGE seguro ejecutado desde T_METADATA."
