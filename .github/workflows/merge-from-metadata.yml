name: MERGE from T_METADATA (depends on nightly)

on:
  workflow_run:
    workflows: ["DEV Nightly load (17:15 Europe/Madrid)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ingestion_name:
        description: "INGESTION_NAME a ejecutar (T_METADATA)"
        required: true
        default: "1.INGESTION-TO-PROD"

permissions:
  contents: read

jobs:
  run-merge:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: prod  # usa secretos del entorno PROD (o el que elijas)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Snowflake CLI
        uses: snowflakedb/snowflake-cli-action@v2.0
        with:
          python-cache-dependency-glob: ""

      - name: Configure Snowflake connection
        shell: bash
        env:
          SF_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SF_USER:      ${{ secrets.SNOWFLAKE_USER }}
          SF_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
          SF_ROLE:      ${{ secrets.SNOWFLAKE_ROLE }}
          SF_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.snowflake && chmod 700 ~/.snowflake
          cat > ~/.snowflake/config.toml <<EOF
          [connections.default]
          account = "${SF_ACCOUNT}"
          user = "${SF_USER}"
          password = "${SF_PASSWORD}"
          role = "${SF_ROLE}"
          warehouse = "${SF_WAREHOUSE}"
          authenticator = "snowflake"
          client_session_keep_alive = true
          EOF
          chmod 600 ~/.snowflake/config.toml
          export SF_SKIP_WARNING_FOR_READ_PERMISSIONS_ON_CONFIG_FILE=true
          snow --version
          snow sql -q "SELECT CURRENT_ACCOUNT(), CURRENT_ROLE(), CURRENT_WAREHOUSE();"

      - name: Prepare SQL (inject ingestion name)
        shell: bash
        run: |
          set -euo pipefail
          ING="${{ github.event.inputs.ingestion_name }}"
          if [ -z "${ING:-}" ]; then ING="1.INGESTION-TO-PROD"; fi
          sed "s/__ING__/${ING//\//\\/}/g" scripts/merge_from_metadata.sql.tmpl > run_merge.sql
          echo "== first 25 lines ==" && head -n 25 run_merge.sql || true
          echo "== last 25 lines =="  && tail -n 25 run_merge.sql || true

      - name: Execute MERGE from metadata
        shell: bash
        run: |
          set -euo pipefail
          snow sql --filename run_merge.sql

      - name: Done
        run: echo "✅ MERGE completado desde T_METADATA."
