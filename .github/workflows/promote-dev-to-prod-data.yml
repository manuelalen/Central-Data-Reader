name: Promote DEV → PROD (metadata-driven, depends on nightly)

on:
  # Depende del nightly
  workflow_run:
    workflows: ["DEV Nightly load (17:15 Europe/Madrid)"]
    types: [completed]

  # Opcional: ejecución manual
  workflow_dispatch:
    inputs:
      ingestion_name:
        description: "Nombre de la ingestión definida en T_METADATA"
        required: true
        default: "1.INGESTION-TO-PROD"

permissions:
  contents: read

jobs:
  promote:
    # Solo si el nightly fue OK o si es manual
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify SQL template exists
        shell: bash
        run: |
          test -f scripts/run_ingestion.sql.tmpl || { echo "❌ Falta scripts/run_ingestion.sql.tmpl"; exit 1; }

      - name: Set up Snowflake CLI
        uses: snowflakedb/snowflake-cli-action@v2.0
        with:
          python-cache-dependency-glob: ""

      - name: Configure Snowflake connection
        shell: bash
        env:
          SF_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SF_USER:      ${{ secrets.SNOWFLAKE_USER }}
          SF_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
          SF_ROLE:      ${{ secrets.SNOWFLAKE_ROLE }}
          SF_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.snowflake && chmod 700 ~/.snowflake
          cat > ~/.snowflake/config.toml <<EOF
          [connections.default]
          account = "${SF_ACCOUNT}"
          user = "${SF_USER}"
          password = "${SF_PASSWORD}"
          role = "${SF_ROLE}"
          warehouse = "${SF_WAREHOUSE}"
          authenticator = "snowflake"
          client_session_keep_alive = true
          EOF
          chmod 600 ~/.snowflake/config.toml
          export SF_SKIP_WARNING_FOR_READ_PERMISSIONS_ON_CONFIG_FILE=true
          snow --version
          snow sql -q "SELECT CURRENT_ACCOUNT(), CURRENT_ROLE(), CURRENT_WAREHOUSE();"

      - name: Prepare SQL from template
        shell: bash
        run: |
          set -euo pipefail
          ING="${{ github.event.inputs.ingestion_name }}"
          if [ -z "${ING:-}" ]; then ING="1.INGESTION-TO-PROD"; fi
          sed "s/__ING__/${ING//\//\\/}/g" scripts/run_ingestion.sql.tmpl > run_ingestion.sql
          echo "== run_ingestion.sql (first 20) ==" && head -n 20 run_ingestion.sql || true
          echo "== run_ingestion.sql (last 20) ==" && tail -n 20 run_ingestion.sql || true

      - name: Execute metadata-driven promotion
        shell: bash
        run: |
          set -euo pipefail
          snow sql --filename run_ingestion.sql

      - name: Done
        run: echo "✅ Promotion DEV → PROD completada."
